services:
  - type: web
    name: codeeagle-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DATABASE_URL
        fromDatabase:
          name: codeeagle-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_EMAIL
        value: admin@codeeagle.com
      - key: ADMIN_PASSWORD
        value: AdminPassword123!
      - key: API_V1_STR
        value: /api/v1
      - key: PROJECT_NAME
        value: Code Eagle Info Solution API

databases:
  - name: codeeagle-db
    databaseName: codeeagle_db
    user: postgres
    plan: free
